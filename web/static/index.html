<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowSight</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="brand"><span class="logo"></span><span>FlowSight</span><span id="site" class="muted"></span></div>
    <nav id="menu"></nav>
    <div class="navfoot">
      <div id="health-pill" class="pill">…</div>
      <div id="version" class="muted"></div>
      <div id="attrib"></div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="navtoggle" class="iconbtn" aria-label="Menu">☰</button>
      <h1 id="title">FlowSight</h1>
      <div class="spacer"></div>
      <div id="range" class="seg"></div>
      <div id="layout"></div>
      <button id="pause" class="iconbtn" aria-label="Pause auto-refresh">⏸</button>
      <input id="search" type="search" placeholder="Find host, domain, app…" autocomplete="off">
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="toast"></div>
<div id="modal" hidden><div class="modal-card"><div id="modal-body"></div></div></div>
<script src="/static/lib.js"></script>
<script src="/static/smartsearch.js"></script>
<script src="/static/panels.js"></script>
<script src="/static/land.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/pages2.js"></script>
<script src="/static/pages3.js"></script>
<script src="/static/apps.js"></script>
<script src="/static/advice.js"></script>
<script src="/static/names.js"></script>
<script src="/static/setup.js"></script>
<script src="/static/proxmox.js"></script>
<script src="/static/space.js"></script>
<script src="/static/space-gl.js"></script>
<script src="/static/api.js"></script>
<script src="/static/app.js"></script>
<script src="/static/inspect.js"></script>
</body>
</html>
