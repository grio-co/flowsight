# golangci-lint configuration (v2 format).
#
# Only linters that are clean on the current tree are enabled, so that CI is
# a real gate. The standard set is off because of pre-existing findings
# (counts from `golangci-lint run ./...` with `default: standard` plus gofmt,
# unconvert and misspell, 2026-09-26): errcheck 50, unused 41, staticcheck 25,
# ineffassign 7, unconvert 3, gofmt 1 (internal/modules/proxmox/map_test.go).
# Turn them on one at a time (`default: standard`, then add the formatter)
# once the findings are fixed.
version: "2"

linters:
  default: none
  enable:
    - govet
    - misspell
    - nolintlint
    - gocheckcompilerdirectives
    - durationcheck
    - copyloopvar
    - bidichk
    - asasalint
    - errname
    - reassign
