# golangci-lint configuration (v2 format). Kept deliberately small: the
# standard set plus a few cheap, low-noise checks. Extend as the code settles.
version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
